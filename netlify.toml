[build]
command = "npm run build"
publish = "dist"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"

[[redirects]]
from = "/leaderboard"
to = "/index.html"
status = 200

[[redirects]]
from = "/account"
to = "/index.html"
status = 200
